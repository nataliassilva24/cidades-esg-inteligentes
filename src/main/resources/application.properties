spring.application.name=cidades-esg-inteligentes
server.port=${PORT:8080}

# Conexão com o banco vem SEMPRE de variáveis de ambiente (nada sensível no código)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PWD}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Identificação do ambiente (local, staging, production) e da versão (SHA do commit no pipeline)
app.ambiente=${APP_ENV:local}
app.versao=${APP_VERSION:dev}

# Actuator: health check usado pelo Docker Compose e pelo pipeline (smoke test)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
