spring.application.name=healthtrack

# Conexão com o banco vem SEMPRE de variáveis de ambiente (nada sensível no código)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Schema versionado pelo Flyway (db/migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Identificação do ambiente (local, staging, production) e da versão (SHA do commit no pipeline)
app.ambiente=${APP_ENV:local}
app.versao=${APP_VERSION:dev}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
