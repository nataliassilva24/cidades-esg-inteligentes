# Orquestração local: HealthTrack API + banco MySQL
# Uso:  cp .env.example .env  &&  docker compose up -d --build
name: healthtrack

services:
  db:
    image: mysql:8.0
    container_name: healthtrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql        # persistência dos dados do banco
    networks:
      - healthtrack-net
    healthcheck:                         # a API só sobe quando o banco estiver pronto
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: healthtrack-api:local
    container_name: healthtrack-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - healthtrack-net

volumes:
  mysql_data:

networks:
  healthtrack-net:
    driver: bridge
