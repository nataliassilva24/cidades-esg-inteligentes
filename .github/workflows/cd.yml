# Entrega/Implantação Contínua
#   push em develop -> testes -> imagem Docker (GHCR) -> deploy em STAGING
#   push em main    -> testes -> imagem Docker (GHCR) -> deploy em PRODUÇÃO (com aprovação manual)
name: CD - Build, Imagem e Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # necessário para publicar a imagem no GitHub Container Registry

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cidades-esg-api

jobs:
  # ---------------------------------------------------------------
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java SDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: mvn -B clean verify

  # ---------------------------------------------------------------
  build-image:
    name: Build e push da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:${{ github.ref_name == 'main' && 'production' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy STAGING
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy no Azure Web App (staging)
        if: vars.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build-image.outputs.image }}:${{ github.sha }}

      - name: Smoke test (health check)
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.APP_URL }}/actuator/health" | grep -q '"UP"'; then
              echo "Staging saudável"; curl -fsS "${{ vars.APP_URL }}/"; exit 0
            fi
            echo "Aguardando aplicação... ($i/20)"; sleep 15
          done
          echo "Staging não respondeu ao health check"; exit 1

      - name: Aviso - ambiente ainda não configurado
        if: vars.AZURE_WEBAPP_NAME == ''
        run: echo "::warning::Variáveis do ambiente 'staging' não configuradas; deploy ignorado. Imagem publicada em ${{ needs.build-image.outputs.image }}:${{ github.sha }}"

  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy PRODUÇÃO
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    environment:
      name: production          # configurar "Required reviewers" no GitHub para aprovação manual
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy no Azure Web App (produção)
        if: vars.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build-image.outputs.image }}:${{ github.sha }}

      - name: Smoke test (health check)
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.APP_URL }}/actuator/health" | grep -q '"UP"'; then
              echo "Produção saudável"; curl -fsS "${{ vars.APP_URL }}/"; exit 0
            fi
            echo "Aguardando aplicação... ($i/20)"; sleep 15
          done
          echo "Produção não respondeu ao health check"; exit 1

      - name: Aviso - ambiente ainda não configurado
        if: vars.AZURE_WEBAPP_NAME == ''
        run: echo "::warning::Variáveis do ambiente 'production' não configuradas; deploy ignorado. Imagem publicada em ${{ needs.build-image.outputs.image }}:${{ github.sha }}"
