# Testes automatizados BDD (Cucumber/Gherkin) e de API (status code, corpo JSON e contrato JSON Schema).
# Sobe a API real + MySQL com Docker Compose e executa a suíte de testes-bdd contra ela.
name: Testes BDD e de API

on:
  push:
    branches: ["feature/**", develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  bdd:
    name: Cucumber + RestAssured + JSON Schema
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Criar .env de teste (segredos gerados só para esta execução)
        run: |
          cp .env.example .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env

      - name: Subir API + MySQL (Docker Compose)
        run: docker compose up -d --build db api

      - name: Aguardar API saudável
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health && exit 0
            sleep 3
          done
          docker compose logs api
          exit 1

      - name: Setup Java SDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes BDD
        working-directory: testes-bdd
        run: mvn -B clean test -DbaseUrl=http://localhost:8080

      - name: Publicar relatório Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-bdd
          path: |
            testes-bdd/target/cucumber-reports/
            testes-bdd/target/surefire-reports/

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v
